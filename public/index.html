<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Room</title>
  <link rel="stylesheet" href="css.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/png" href="Share.png" >
</head>
<body>
  <header class="hero">
    <p class="eyebrow">CIS multicloud incident collaboration</p>
    <h1>Incident Room</h1>
    <p class="subtitle">Join a room, share updates, upload logs or screenshots, and keep every incident note in one place.</p>
  </header>

  <div id="roomInfo">
  <p id="roomStatus">Not in any incident room</p>
  <p id="memberCount">Members online: 0</p>
  </div>

  <form id="roomForm">
    <input type="text" id="roomInput" placeholder="Enter incident room name..." required>
    <button type="submit">Join Incident</button>
    <button type="button" id="exitRoomButton">Leave Room</button>
  </form>

  <form id="textForm">
    <textarea id="textInput" placeholder="Paste an update, log snippet, link, or handoff note..." required></textarea>
    <button type="submit">Post Update</button>
  </form>

  <section id="shared-content">
    <h2>Incident Timeline</h2>
    <ul id="sharedTexts">
      <!-- Shared texts will appear here dynamically -->
    </ul>
  </section>

  <form id="uploadForm">
    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.mp4,.pdf,.mp3,.txt,.log,.json" required>
    <button type="submit">Upload Evidence</button>
  </form>

  <section id="shared-content">
  <h2>Shared Files</h2>
  <ul id="fileList"></ul>
  </section> 

  <script src="/socket.io/socket.io.js"></script>
  <script src="js.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>

  <div id="chat-container">
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Ask for a quick incident summary..." />
    <button id="send-button">Summarize</button>
  </div>
  
</body>
</html>
